<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>FoodieHub - Food Ordering</title>
</head>

<body>

<header>
    <h1>🍔 FoodieHub</h1>
    <p>Delicious food, delivered to you!</p>
</header>

<section class="menu">
    
    <div class="food-card">
        <h2>🍕 Pizza</h2>
        <p>Cheesy and delicious pizza</p>
        <h3>₹199</h3>
        <button>Order Now</button>
    </div>

    <div class="food-card">
        <h2>🍔 Burger</h2>
        <p>Fresh and tasty burger</p>
        <h3>₹149</h3>
        <button>Order Now</button>
    </div>

    <div class="food-card">
        <h2>🍟 French Fries</h2>
        <p>Crispy golden fries</p>
        <h3>₹99</h3>
        <button>Order Now</button>
    </div>

</section>
<script src ="script.js"></script>
</body>
</html>
